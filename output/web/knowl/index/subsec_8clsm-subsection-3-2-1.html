<dfn class="terminology">Elements:</dfn> An element  is a pure substance that cannot be broken down into simpler substances by any chemical means. Elements are the building blocks of all matter and are composed of only one type of atom. Examples of elements include hydrogen, oxygen, and gold.</article><span class="incontext"><a class="internal" href="sec_eighth-intro.html#subsec_8clsm-subsection-3-2-1">in-context</a></span>
